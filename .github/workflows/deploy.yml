name: Verify and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Verify server
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install client dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Validate production configuration
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYCHAT_2CE41 }}
        run: |
          test -n "$REACT_APP_API_URL" || (echo "Missing repository variable REACT_APP_API_URL" && exit 1)
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo "Missing repository secret FIREBASE_SERVICE_ACCOUNT_MYCHAT_2CE41" && exit 1)

      - name: Verify and build client
        working-directory: client
        env:
          CI: true
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_SOCKET_URL: ${{ vars.REACT_APP_SOCKET_URL }}
        run: |
          npx tsc --noEmit
          npm test -- --watchAll=false
          npm run build

      - name: Deploy client to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYCHAT_2CE41 }}
          projectId: mychat-2ce41
          channelId: live
          entryPoint: client
